[package]
name = "designcraft-cli"
description = "NiftyDesign opens and edits Microsoft Publisher (.pub) files from Publisher 2002 and newer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "designcraft-cli"
path = "src/main.rs"

[dependencies]
designcraft-pub = { workspace = true }
designcraft-engine = { workspace = true }
designcraft-render = { workspace = true }
designcraft-doc = { workspace = true }
designcraft-geom = { workspace = true }
designcraft-color = { workspace = true }
designcraft-compose = { workspace = true }
designcraft-format = { workspace = true }
designcraft-pdf = { workspace = true }
designcraft-mcp = { workspace = true }
serde_json = { workspace = true }
