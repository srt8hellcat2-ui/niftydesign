name: Bug report
description: Something in NiftyDesign (unofficial alpha) does not work. Reports go here, never to ArtCraft.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        NiftyDesign is an unofficial alpha based on DesignCraft by the ArtCraft team. It is not supported by ArtCraft. **Report problems here, never to the ArtCraft repositories.** Please check the Known limitations page first.

        **Issues here are public.** Do not post names, addresses, phone numbers, photos of people or anything private. You do not need to attach your .pub; only attach one if everyone is welcome to see it (see docs/SAMPLE-REQUEST.md).
  - type: input
    id: version
    attributes:
      label: NiftyDesign version
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened (and what you expected). Include exact warning or error text; say if it crashed.
    validations:
      required: true
  - type: textarea
    id: missing
    attributes:
      label: What did you look for and not find, compared with Microsoft Publisher?
